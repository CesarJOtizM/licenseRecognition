[project]
name = "lr-contracts"
version = "0.1.0"
description = "Contratos de eventos compartidos (PlateRead) entre los servicios de licenseRecognition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "uuid-utils>=1,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=lr_contracts",
  "--cov-report=term-missing",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
