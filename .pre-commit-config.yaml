# Chequeos que corren automáticamente con git.
# Instalar una vez por clon:  uvx pre-commit install
# Correr todo a mano:         uvx pre-commit run --all-files

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(ps1|bat)$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: quitar-coautor-ia
        name: quitar trailer de coautor IA
        entry: python scripts/quitar_coautor_ia.py
        language: python
        stages: [commit-msg]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Hooks locales: usan el entorno de cada servicio (uv) porque mypy y pytest
  # necesitan las dependencias del servicio para funcionar.
  # edge-agent también se revisa cuando cambia packages/contracts, porque depende de él.
  - repo: local
    hooks:
      - id: mypy-edge-agent
        name: mypy (edge-agent)
        entry: uv run --directory services/edge-agent mypy
        language: system
        files: ^(services/edge-agent|packages/contracts)/
        types: [python]
        pass_filenames: false

      - id: pytest-edge-agent
        name: pytest (edge-agent)
        entry: uv run --directory services/edge-agent pytest
        language: system
        files: ^(services/edge-agent|packages/contracts)/
        pass_filenames: false
        stages: [pre-push]

      - id: mypy-contracts
        name: mypy (contracts)
        entry: uv run --directory packages/contracts mypy
        language: system
        files: ^packages/contracts/
        types: [python]
        pass_filenames: false

      # Sin filtro de tipos: un cambio en el esquema JSON también debe correr las pruebas.
      - id: pytest-contracts
        name: pytest (contracts)
        entry: uv run --directory packages/contracts pytest
        language: system
        files: ^packages/contracts/
        pass_filenames: false
        stages: [pre-push]

      - id: mypy-api
        name: mypy (api)
        entry: uv run --directory services/api mypy
        language: system
        files: ^services/api/
        types: [python]
        pass_filenames: false

      # Sin las pruebas `db`: el push no debe depender de Docker. La CI corre todas.
      - id: pytest-api
        name: pytest (api, sin base de datos)
        entry: uv run --directory services/api pytest -m "not db" --no-cov
        language: system
        files: ^services/api/
        pass_filenames: false
        stages: [pre-push]
