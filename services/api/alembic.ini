# Configuración de Alembic (migraciones de la base). Se usa desde services/api:
#   uv run --directory services/api alembic upgrade head

[alembic]
script_location = %(here)s/migrations
# Revisiones con id corto y ordenado: se crean con --rev-id 0002, 0003...
file_template = %%(rev)s_%%(slug)s
path_separator = os
# Vacía a propósito: migrations/env.py toma DATABASE_URL de Settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
