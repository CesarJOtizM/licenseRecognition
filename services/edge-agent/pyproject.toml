[project]
name = "edge-agent"
version = "0.1.0"
description = "Equipo local de la portería: captura, lectura de placas, decisión y puerta"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=edge_agent",
  "--cov-report=term-missing",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
strict = true
files = ["src", "tests"]
